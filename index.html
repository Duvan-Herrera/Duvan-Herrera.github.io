<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <title>Menús digitales</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4efe5; color: #17324d; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(560px, 100%); background: #fffdf8; border: 1px solid #ded4c4; border-radius: 24px; padding: 34px 24px; box-shadow: 0 18px 50px #17324d22; text-align: center; }
      h1 { margin: 0 0 10px; font-size: clamp(2rem, 8vw, 3.2rem); letter-spacing: -.04em; }
      p { margin: 0 0 26px; color: #5f6b72; line-height: 1.5; }
      nav { display: grid; gap: 12px; }
      a { display: block; padding: 16px 18px; border-radius: 14px; background: #17324d; color: white; text-decoration: none; font-weight: 700; transition: transform .15s ease, background .15s ease; }
      a:hover, a:focus-visible { background: #285777; transform: translateY(-2px); }
      small { display: block; margin-top: 25px; color: #8b8173; }
    </style>
  </head>
  <body>
    <main>
      <h1>Menús digitales</h1>
      <p>Seleccione el restaurante que desea consultar.</p>
      <nav aria-label="Restaurantes">
        <a href="/rancho-del-marisco-menu/">Rancho del Marisco</a>
        <a href="/aqui-es-menu/">Bar y Restaurante Aquí Es</a>
        <a href="/soda-gaby-menu/">Soda Gaby</a>
      </nav>
      <small>Abra el enlace y agréguelo a su código QR correspondiente.</small>
    </main>
  </body>
</html>
